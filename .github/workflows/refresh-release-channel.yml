name: Refresh Release Channel

on:
  repository_dispatch:
    types:
      - refresh-channel-release
  workflow_dispatch:
    inputs:
      source_tag:
        description: Versioned release tag to mirror into the rolling channel
        required: true
        type: string
      channel:
        description: Channel to refresh, or auto to infer from the source tag
        required: false
        default: auto
        type: choice
        options:
          - auto
          - alpha
          - beta
          - stable

permissions:
  contents: write

concurrency:
  group: refresh-release-channel-${{ github.event.client_payload.channel || github.event.inputs.channel || github.event.client_payload.source_tag || github.event.inputs.source_tag }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: [self-hosted, Windows]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_TAG: ${{ github.event.client_payload.source_tag || github.event.inputs.source_tag }}
      REQUESTED_CHANNEL: ${{ github.event.client_payload.channel || github.event.inputs.channel || 'auto' }}
    steps:
      - name: Refresh rolling release
        shell: bash
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          source_tag="${SOURCE_TAG}"
          requested_channel="${REQUESTED_CHANNEL:-auto}"

          if [[ -z "$source_tag" ]]; then
            echo "source_tag is required"
            exit 1
          fi

          if [[ "$source_tag" =~ ^(alpha|beta|stable)-latest$ ]]; then
            echo "Skipping rolling channel tag: $source_tag"
            exit 0
          fi

          if [[ "$requested_channel" == "auto" || -z "$requested_channel" ]]; then
            if [[ "$source_tag" =~ [Aa]lpha ]]; then
              channel="alpha"
            elif [[ "$source_tag" =~ [Bb]eta ]]; then
              channel="beta"
            else
              channel="stable"
            fi
          else
            channel="$requested_channel"
          fi

          case "$channel" in
            alpha|beta|stable) ;;
            *)
              echo "Unsupported channel: $channel"
              exit 1
              ;;
          esac

          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          notes_file="$work_dir/release-notes.md"
          assets_dir="$work_dir/assets"
          mkdir -p "$assets_dir"

          release_json="$work_dir/source-release.json"
          gh api "repos/$repo/releases/tags/$source_tag" > "$release_json"

          title="$(jq -r '.name // .tag_name' "$release_json")"
          jq -r '.body // ""' "$release_json" > "$notes_file"
          if [[ ! -s "$notes_file" ]]; then
            printf 'Channel mirror of `%s` release `%s`.\n' "$repo" "$source_tag" > "$notes_file"
          fi

          # Issue #107: 2026-08-10, this step reported success but published
          # alpha-latest in draft state, missing the Android APK entirely --
          # the source release itself was complete, only this mirror step's
          # download was short. `gh release download` can run before all of
          # a just-created source release's assets are fully visible via the
          # API (a GitHub-side asset-visibility race), and the old check here
          # only verified "at least one file downloaded", not "downloaded
          # everything the source release actually has" -- a partial
          # download (4 of 5 files) passed silently. Compare against the
          # source release's own asset list (already in $release_json) and
          # retry with backoff before giving up loudly.
          expected_assets_file="$work_dir/expected-assets.txt"
          jq -r '.assets[].name' "$release_json" | sort > "$expected_assets_file"
          expected_count="$(wc -l < "$expected_assets_file")"
          if [[ "$expected_count" -eq 0 ]]; then
            echo "Source release $source_tag has no assets; refusing to publish an empty channel release."
            exit 1
          fi

          downloaded_assets_file="$work_dir/downloaded-assets.txt"
          max_download_attempts=3
          attempt=1
          while true; do
            # `|| true`: under set -e, an outright download failure (not just
            # an incomplete one) would otherwise kill the script here before
            # the retry loop below ever runs -- exactly the same asset-
            # visibility race, just surfacing as a failed call instead of a
            # short one. Treat it the same as "downloaded nothing this
            # attempt" and let the diff/retry logic below handle it.
            gh release download "$source_tag" --repo "$repo" --dir "$assets_dir" --clobber || true
            find "$assets_dir" -maxdepth 1 -type f -print0 \
              | xargs -0 -n1 basename \
              | sort > "$downloaded_assets_file"

            if diff -q "$expected_assets_file" "$downloaded_assets_file" >/dev/null; then
              break
            fi

            missing="$(grep -vxFf "$downloaded_assets_file" "$expected_assets_file" || true)"
            if [[ "$attempt" -ge "$max_download_attempts" ]]; then
              echo "Source release $source_tag has $expected_count asset(s) but the download is still incomplete after $max_download_attempts attempts; missing:"
              echo "$missing"
              echo "Refusing to publish an incomplete channel mirror."
              exit 1
            fi

            echo "Downloaded asset set doesn't match source release (missing: $missing) -- retrying download (attempt $attempt/$max_download_attempts)..."
            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done

          mapfile -d '' assets < <(find "$assets_dir" -maxdepth 1 -type f -print0 | sort -z)

          ref_json="$work_dir/source-ref.json"
          gh api "repos/$repo/git/ref/tags/$source_tag" > "$ref_json"
          ref_type="$(jq -r '.object.type' "$ref_json")"
          target_sha="$(jq -r '.object.sha' "$ref_json")"
          if [[ "$ref_type" == "tag" ]]; then
            tag_json="$work_dir/source-tag.json"
            gh api "repos/$repo/git/tags/$target_sha" > "$tag_json"
            target_sha="$(jq -r '.object.sha' "$tag_json")"
          fi

          channel_tag="${channel}-latest"
          gh release delete "$channel_tag" --repo "$repo" --cleanup-tag --yes >/dev/null 2>&1 || true

          args=(
            release create "$channel_tag"
            --repo "$repo"
            --target "$target_sha"
            --title "$title"
            --notes-file "$notes_file"
          )

          if [[ "$channel" == "stable" ]]; then
            args+=(--latest)
          else
            args+=(--prerelease --latest=false)
          fi

          gh "${args[@]}" "${assets[@]}"

          # Issue #107 follow-up: the reported draft:true result wasn't fully
          # explained by the download gap alone (gh release create isn't
          # passed --draft). Root cause aside, verify what actually got
          # published instead of trusting `gh release create`'s own exit
          # code -- catches that anomaly, or any other way this mirror could
          # end up incomplete, as a hard failure instead of a silent one.
          created_json="$work_dir/created-release.json"
          gh api "repos/$repo/releases/tags/$channel_tag" > "$created_json"
          created_draft="$(jq -r '.draft' "$created_json")"
          created_asset_count="$(jq '.assets | length' "$created_json")"
          if [[ "$created_draft" != "false" || "$created_asset_count" -ne "$expected_count" ]]; then
            echo "Published channel release $channel_tag failed verification: draft=$created_draft, assets=$created_asset_count/$expected_count expected."
            exit 1
          fi
